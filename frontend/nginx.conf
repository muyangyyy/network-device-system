server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Vue Router history mode
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 入口页永不缓存（SPA 部署生命线）：
    # index.html 引用带内容哈希的 bundle，每次构建 hash 全换、旧 chunk 立即 404。
    # 若 index.html 被浏览器缓存，用户会拿到引用已 404 资源的旧入口 → 整站 JS 挂、按钮全无反应。
    # 只用 add_header（不加 expires 指令），避免两者叠加产生重复 Cache-Control 头；
    # try_files 的 fallback 是内部重定向，会重新命中本 location，SPA 路由同样覆盖。
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # API proxy
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        client_max_body_size 10m;
    }

    # Uploaded files proxy（^~ 保证优先于下方静态资源正则匹配）
    # 注意：expires 指令本身就会写出 Cache-Control: max-age=...，
    # 再叠一条 add_header Cache-Control 会得到两个同名响应头（nginx 的 add_header 是追加而非覆盖），
    # 部分客户端/中间代理对重复 Cache-Control 的处理不一致，因此只保留 expires。
    location ^~ /uploads/ {
        proxy_pass http://backend:8080/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
    }

    # Static resources caching
    # Vite 产物的文件名带内容哈希，可以放心长缓存；同样只保留 expires，不叠加 add_header。
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
    }
}
